[pytest]
testpaths = tests
# `slow` tests re-run a full walk-forward and a 40-trial noise test (~1 min).
# They are excluded by default so the PostToolUse hook stays fast enough to run
# after every edit. Run them explicitly before publishing any number:
#     python -m pytest -m slow
addopts = -m "not slow"
markers =
    slow: re-runs real backtests; excluded from the default suite
